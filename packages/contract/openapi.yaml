  /collections:
    post:
      operationId: createCollection
      tags: [receivables]
      summary: >
        Record a collection (cash/bank transfer/post-dated cheque) and
        allocate it across open invoices immediately, either automatically
        FIFO by due date (DOMAIN.md Invariant 7) or via an explicit manual
        plan — invoice status reflects the allocation right away for every
        method, including post-dated cheques. `method: post_dated_cheque`
        additionally requires bankName/chequeNumber/chequeDueDate and
        creates a linked PostDatedCheque row in `pending` status, tracked
        through deposit/clear separately; if it later bounces
        (`/post-dated-cheques/{id}/bounce`) or is cancelled while still
        pending, its allocation is unwound and the invoice(s) it applied
        to are reopened — DOMAIN.md's "unwinding allocations" language
        only makes sense if the allocation existed before the bounce, so
        that is when it's created, not deferred to clearing.
      security: [{ bearerAuth: [] }]
      parameters:
        - name: Idempotency-Key
          in: header
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CreateCollectionRequest" }
