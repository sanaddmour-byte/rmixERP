      operationId: cancelPurchaseOrder
      tags: [procurement]
      summary: draft|submitted|approved -> cancelled. Blocked once any goods have been received.
      security: [{ bearerAuth: [] }]
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PurchaseOrderDetail" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "400": { $ref: "#/components/responses/ValidationError" }

  /goods-receipts:
    post:
      operationId: createGoodsReceipt
      tags: [procurement]
      summary: >
        Record one receiving event against an approved purchase order (one
        or more lines at once, with optional photos captured inline as
        data URLs — matching Phase 5's SignaturePad, no object storage in
        this codebase). Applies each line's quantity to branch stock via
        the same moving-average `applyStockReceipt` Phase 3 uses for
        manual stock adjustments. Moves the PO to `received` on its first
        receipt (DOMAIN.md's coarse-grained PO table has no
        partially-received state; variance is read from `GET
        /purchase-orders/{id}` instead).
      security: [{ bearerAuth: [] }]
      parameters:
        - name: Idempotency-Key
          in: header
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CreateGoodsReceiptRequest" }
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/GoodsReceiptDetail" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "400": { $ref: "#/components/responses/ValidationError" }
    get:
      operationId: listGoodsReceipts
      tags: [procurement]
      summary: List goods receipts.
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: "#/components/parameters/PageParam"
        - $ref: "#/components/parameters/PageSizeParam"
        - name: purchaseOrderId
          in: query
          schema: { type: string, format: uuid }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/GoodsReceiptListResponse" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }

  /goods-receipts/{id}:
    parameters:
      - $ref: "#/components/parameters/IdParam"
    get:
      operationId: getGoodsReceipt
      tags: [procurement]
      summary: Get a goods receipt with its lines by id.
      security: [{ bearerAuth: [] }]
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/GoodsReceiptDetail" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /vendor-bills:
    post:
      operationId: createVendorBill
      tags: [procurement]
      summary: >
        Create a draft vendor bill against a purchase order, one or more
        lines each referencing a PO line (quantity up to what remains
        unbilled on that line; price/tax rate are always the PO line's
        own, never re-entered). Moves the PO to `billed`.
      security: [{ bearerAuth: [] }]
      parameters:
        - name: Idempotency-Key
          in: header
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CreateVendorBillRequest" }
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/VendorBillDetail" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "400": { $ref: "#/components/responses/ValidationError" }
    get:
      operationId: listVendorBills
      tags: [procurement]
      summary: List vendor bills.
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: "#/components/parameters/PageParam"
        - $ref: "#/components/parameters/PageSizeParam"
        - name: status
          in: query
          schema: { type: string, enum: [draft, approved, partially_paid, paid, cancelled] }
        - name: vendorId
          in: query
          schema: { type: string, format: uuid }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/VendorBillListResponse" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }

  /vendor-bills/{id}:
    parameters:
      - $ref: "#/components/parameters/IdParam"
    get:
      operationId: getVendorBill
      tags: [procurement]
      summary: Get a vendor bill with its lines and payment allocations by id.
      security: [{ bearerAuth: [] }]
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/VendorBillDetail" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /vendor-bills/{id}/approve:
    parameters:
      - $ref: "#/components/parameters/IdParam"
    post:
      operationId: approveVendorBill
      tags: [procurement]
      summary: >
        draft -> approved. Posts the bill to the GL: debits Inventory (raw
        material lines) and Tax Input for the bill's tax, credits Accounts
        Payable for the total — the first of this phase's two GL-posting
        events (payment is the other).
      security: [{ bearerAuth: [] }]
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/VendorBillDetail" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "400": { $ref: "#/components/responses/ValidationError" }

  /payments:
    post:
      operationId: createPayment
      tags: [procurement]
      summary: >
        Record a payment to a vendor and allocate it across open vendor
        bills immediately, FIFO by due date or via an explicit manual
        plan — the AP mirror of Phase 8's `POST /collections`. Posts to
        the GL: debits Accounts Payable for the allocated amount, credits
        Cash/Bank.
      security: [{ bearerAuth: [] }]
      parameters:
        - name: Idempotency-Key
          in: header
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CreatePaymentRequest" }
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PaymentDetail" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "400": { $ref: "#/components/responses/ValidationError" }
    get:
      operationId: listPayments
      tags: [procurement]
      summary: List payments.
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: "#/components/parameters/PageParam"
        - $ref: "#/components/parameters/PageSizeParam"
        - name: vendorId
          in: query
          schema: { type: string, format: uuid }
        - name: method
          in: query
          schema: { type: string, enum: [cash, bank_transfer, cheque] }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PaymentListResponse" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }

  /payments/{id}:
    parameters:
      - $ref: "#/components/parameters/IdParam"
    get:
      operationId: getPayment
      tags: [procurement]
      summary: Get a payment with its allocations by id.
      security: [{ bearerAuth: [] }]
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PaymentDetail" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /gl/accounts:
    post:
      operationId: createAccount
      tags: [gl]
      summary: Create a chart-of-accounts entry.
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CreateAccountRequest" }
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Account" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "400": { $ref: "#/components/responses/ValidationError" }
    get:
      operationId: listAccounts
      tags: [gl]
      summary: List the chart of accounts.
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: "#/components/parameters/PageParam"
        - $ref: "#/components/parameters/PageSizeParam"
        - name: type
          in: query
          schema: { type: string, enum: [asset, liability, equity, revenue, expense] }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AccountListResponse" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }

  /gl/accounts/{id}:
    parameters:
      - $ref: "#/components/parameters/IdParam"
    get:
      operationId: getAccount
      tags: [gl]
      summary: Get one account by id.
      security: [{ bearerAuth: [] }]
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Account" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
    put:
      operationId: updateAccount
      tags: [gl]
      summary: Rename an account or move it in the tree (parentAccountId). Its type/code are immutable once postings exist against it.
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/UpdateAccountRequest" }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Account" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "400": { $ref: "#/components/responses/ValidationError" }

  /gl/cost-centers:
    post:
      operationId: createCostCenter
      tags: [gl]
      summary: Create a cost center.
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CreateCostCenterRequest" }
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CostCenter" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "400": { $ref: "#/components/responses/ValidationError" }
    get:
      operationId: listCostCenters
      tags: [gl]
      summary: List cost centers.
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: "#/components/parameters/PageParam"
        - $ref: "#/components/parameters/PageSizeParam"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CostCenterListResponse" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }

  /gl/journal-entries:
    get:
      operationId: listJournalEntries
      tags: [gl]
      summary: >
        List journal entries. Read-only — entries are only ever created as
        a side effect of a business event (vendor bill approval, payment),
        never posted directly, per CLAUDE.md's double-entry Hard Rule.
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: "#/components/parameters/PageParam"
        - $ref: "#/components/parameters/PageSizeParam"
        - name: sourceDocumentType
          in: query
          schema: { type: string }
        - name: branchId
          in: query
          schema: { type: string, format: uuid }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/JournalEntryListResponse" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }

  /gl/journal-entries/{id}:
    parameters:
      - $ref: "#/components/parameters/IdParam"
    get:
      operationId: getJournalEntry
      tags: [gl]
      summary: Get one journal entry with its lines by id.
      security: [{ bearerAuth: [] }]
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/JournalEntryDetail" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /gl/reports/trial-balance:
    get:
      operationId: getTrialBalance
      tags: [gl]
      summary: Every account's balance as of a date, signed positive on its normal side — CLAUDE.md's "a trial balance that doesn't sum to zero fails a test".
      security: [{ bearerAuth: [] }]
      parameters:
        - name: asOf
          in: query
          schema: { type: string, format: date-time }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TrialBalanceResponse" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }

  /gl/reports/profit-and-loss:
    get:
      operationId: getProfitAndLoss
      tags: [gl]
      summary: Revenue and expense account totals over a date range, and the resulting net income.
      security: [{ bearerAuth: [] }]
      parameters:
        - name: from
          in: query
          required: true
          schema: { type: string, format: date-time }
        - name: to
          in: query
          required: true
          schema: { type: string, format: date-time }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ProfitAndLossResponse" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }

  /gl/reports/balance-sheet:
    get:
      operationId: getBalanceSheet
      tags: [gl]
      summary: Asset/liability/equity account balances as of a date.
      security: [{ bearerAuth: [] }]
      parameters:
        - name: asOf
          in: query
          schema: { type: string, format: date-time }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/BalanceSheetResponse" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }

  /gl/reports/cash-flow:
    get:
      operationId: getCashFlow
      tags: [gl]
      summary: >
        Movements on cash/bank accounts (type=asset, code prefix "10")
        over a date range, with a running balance — a direct-method view
        of cash in/out, not a full indirect-method statement classifying
        every account into operating/investing/financing (that
        classification isn't specified anywhere and would be guessed;
        documented simplification, not presented as a complete
        financial statement).
      security: [{ bearerAuth: [] }]
      parameters:
        - name: from
          in: query
          required: true
          schema: { type: string, format: date-time }
        - name: to
          in: query
          required: true
          schema: { type: string, format: date-time }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CashFlowResponse" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  parameters:
    IdParam:
      name: id
      in: path
      required: true
      schema: { type: string, format: uuid }
    PageParam:
      name: page
      in: query
      schema: { type: integer, minimum: 1 }
    PageSizeParam:
      name: pageSize
      in: query
      schema: { type: integer, minimum: 1, maximum: 100 }
    QParam:
      name: q
      in: query
      description: Free-text search.
      schema: { type: string }
    FormatParam:
      name: format
      in: query
      schema: { type: string, enum: [json, csv] }

  responses:
    Unauthorized:
      description: Not authenticated
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ErrorResponse" }
    Forbidden:
      description: Missing permission
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ErrorResponse" }
    NotFound:
      description: Not found
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ErrorResponse" }
    ValidationError:
      description: Validation error
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ErrorResponse" }

  schemas:
    HealthResponse:
      type: object
      required: [status, time]
      properties:
        status: { type: string, enum: [ok] }
        time: { type: string, format: date-time }

    LoginRequest:
      type: object
      required: [email, password]
      properties:
        email: { type: string, format: email }
        password: { type: string, minLength: 8 }

    RefreshRequest:
      type: object
      required: [refreshToken]
      properties:
        refreshToken: { type: string }

    AuthSession:
      type: object
      required: [accessToken, refreshToken, user]
      properties:
        accessToken: { type: string }
        refreshToken: { type: string }
        user: { $ref: "#/components/schemas/CurrentUser" }

    CurrentUser:
      type: object
      required: [id, companyId, branchId, email, displayName, permissions]
      properties:
        id: { type: string, format: uuid }
        companyId: { type: string, format: uuid }
        branchId: { type: string, format: uuid, nullable: true }
        email: { type: string, format: email }
        displayName: { type: string }
        permissions:
          type: array
          items: { type: string, description: "`${module}:${action}`, e.g. \"branches:view\"" }

    ErrorResponse:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [message, code]
          properties:
            message: { type: string }
            code: { type: string }
            details: { type: object }

    VoidRequest:
      type: object
      properties:
        reason: { type: string }

    Company:
      type: object
      required: [id, name, taxNumber, documentExpiryWarningDays, createdAt, updatedAt]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        taxNumber: { type: string, nullable: true }
        documentExpiryWarningDays:
          type: integer
          description: Days before a truck/driver document's expiry it starts showing as a warning (never blocking).
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
    UpdateCompanyRequest:
      type: object
      properties:
        name: { type: string, minLength: 1 }
        taxNumber: { type: string, nullable: true }
        documentExpiryWarningDays: { type: integer, minimum: 0 }

    Branch:
      type: object
      required: [id, companyId, name, code, createdAt, updatedAt, voidedAt]
      properties:
        id: { type: string, format: uuid }
        companyId: { type: string, format: uuid }
        name: { type: string }
        code: { type: string }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
        voidedAt: { type: string, format: date-time, nullable: true }
    CreateBranchRequest:
      type: object
      required: [name, code]
      properties:
        name: { type: string, minLength: 1 }
        code: { type: string, minLength: 1, maxLength: 32 }
    UpdateBranchRequest:
      type: object
      properties:
        name: { type: string, minLength: 1 }
        code: { type: string, minLength: 1, maxLength: 32 }
    BranchListResponse:
      type: object
      required: [items, total, page, pageSize]
      properties:
        items: { type: array, items: { $ref: "#/components/schemas/Branch" } }
        total: { type: integer }
        page: { type: integer }
        pageSize: { type: integer }

    User:
      type: object
      required: [id, companyId, branchId, email, displayName, isActive, roleIds, createdAt, updatedAt, voidedAt]
      properties:
        id: { type: string, format: uuid }
        companyId: { type: string, format: uuid }
        branchId: { type: string, format: uuid, nullable: true }
        email: { type: string, format: email }
        displayName: { type: string }
        isActive: { type: boolean }
        roleIds: { type: array, items: { type: string, format: uuid } }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
        voidedAt: { type: string, format: date-time, nullable: true }
    CreateUserRequest:
      type: object
      required: [email, displayName, password]
      properties:
        email: { type: string, format: email }
        displayName: { type: string, minLength: 1 }
        password: { type: string, minLength: 8 }
        branchId: { type: string, format: uuid, nullable: true }
        roleIds: { type: array, items: { type: string, format: uuid } }
    UpdateUserRequest:
      type: object
      properties:
        displayName: { type: string, minLength: 1 }
        branchId: { type: string, format: uuid, nullable: true }
        isActive: { type: boolean }
        roleIds: { type: array, items: { type: string, format: uuid } }
    UserListResponse:
      type: object
      required: [items, total, page, pageSize]
      properties:
        items: { type: array, items: { $ref: "#/components/schemas/User" } }
        total: { type: integer }
        page: { type: integer }
        pageSize: { type: integer }

    Permission:
      type: object
      required: [id, module, action]
      properties:
        id: { type: string, format: uuid }
        module: { type: string }
        action: { type: string }

    Role:
      type: object
      required: [id, companyId, name, permissionIds, createdAt, updatedAt, voidedAt]
      properties:
        id: { type: string, format: uuid }
        companyId: { type: string, format: uuid }
        name: { type: string }
        permissionIds: { type: array, items: { type: string, format: uuid } }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
        voidedAt: { type: string, format: date-time, nullable: true }
    CreateRoleRequest:
      type: object
      required: [name]
      properties:
        name: { type: string, minLength: 1 }
        permissionIds: { type: array, items: { type: string, format: uuid } }
    UpdateRoleRequest:
      type: object
      properties:
        name: { type: string, minLength: 1 }
        permissionIds: { type: array, items: { type: string, format: uuid } }
    RoleListResponse:
      type: object
      required: [items, total, page, pageSize]
      properties:
        items: { type: array, items: { $ref: "#/components/schemas/Role" } }
        total: { type: integer }
        page: { type: integer }
        pageSize: { type: integer }

    Customer:
      type: object
      required:
        [id, companyId, branchId, name, customerType, phone, email, taxNumber, nationalId, address,
         creditLimitJod, creditPolicy, paymentTermsDays, notes, createdAt, updatedAt, voidedAt]
      properties:
        id: { type: string, format: uuid }
        companyId: { type: string, format: uuid }
