components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  parameters:
    IdParam:
      name: id
      in: path
      required: true
      schema: { type: string, format: uuid }
    PageParam:
      name: page
      in: query
      schema: { type: integer, minimum: 1 }
    PageSizeParam:
      name: pageSize
      in: query
      schema: { type: integer, minimum: 1, maximum: 100 }
    QParam:
      name: q
      in: query
      description: Free-text search.
      schema: { type: string }
    FormatParam:
      name: format
      in: query
      schema: { type: string, enum: [json, csv] }

  responses:
    Unauthorized:
      description: Not authenticated
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ErrorResponse" }
    Forbidden:
      description: Missing permission
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ErrorResponse" }
    NotFound:
      description: Not found
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ErrorResponse" }
    ValidationError:
      description: Validation error
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ErrorResponse" }

  schemas:
    HealthResponse:
      type: object
      required: [status, time]
      properties:
        status: { type: string, enum: [ok] }
        time: { type: string, format: date-time }

    LoginRequest:
      type: object
      required: [email, password]
      properties:
        email: { type: string, format: email }
        password: { type: string, minLength: 8 }

    RefreshRequest:
      type: object
      required: [refreshToken]
      properties:
        refreshToken: { type: string }

    AuthSession:
      type: object
      required: [accessToken, refreshToken, user]
      properties:
        accessToken: { type: string }
        refreshToken: { type: string }
        user: { $ref: "#/components/schemas/CurrentUser" }

    CurrentUser:
      type: object
      required: [id, companyId, branchId, email, displayName, permissions]
      properties:
        id: { type: string, format: uuid }
        companyId: { type: string, format: uuid }
        branchId: { type: string, format: uuid, nullable: true }
        email: { type: string, format: email }
        displayName: { type: string }
        permissions:
          type: array
          items: { type: string, description: "`${module}:${action}`, e.g. \"branches:view\"" }

    ErrorResponse:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [message, code]
          properties:
            message: { type: string }
            code: { type: string }
            details: { type: object }

    VoidRequest:
      type: object
      properties:
        reason: { type: string }

    Company:
      type: object
      required: [id, name, taxNumber, createdAt, updatedAt]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        taxNumber: { type: string, nullable: true }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
    UpdateCompanyRequest:
      type: object
      properties:
        name: { type: string, minLength: 1 }
        taxNumber: { type: string, nullable: true }

    Branch:
      type: object
      required: [id, companyId, name, code, createdAt, updatedAt, voidedAt]
      properties:
        id: { type: string, format: uuid }
        companyId: { type: string, format: uuid }
        name: { type: string }
        code: { type: string }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
        voidedAt: { type: string, format: date-time, nullable: true }
    CreateBranchRequest:
      type: object
      required: [name, code]
      properties:
        name: { type: string, minLength: 1 }
        code: { type: string, minLength: 1, maxLength: 32 }
    UpdateBranchRequest:
      type: object
      properties:
        name: { type: string, minLength: 1 }
        code: { type: string, minLength: 1, maxLength: 32 }
    BranchListResponse:
      type: object
      required: [items, total, page, pageSize]
      properties:
        items: { type: array, items: { $ref: "#/components/schemas/Branch" } }
        total: { type: integer }
        page: { type: integer }
        pageSize: { type: integer }

    User:
      type: object
      required: [id, companyId, branchId, email, displayName, isActive, roleIds, createdAt, updatedAt, voidedAt]
      properties:
        id: { type: string, format: uuid }
        companyId: { type: string, format: uuid }
        branchId: { type: string, format: uuid, nullable: true }
        email: { type: string, format: email }
        displayName: { type: string }
        isActive: { type: boolean }
        roleIds: { type: array, items: { type: string, format: uuid } }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
        voidedAt: { type: string, format: date-time, nullable: true }
    CreateUserRequest:
      type: object
      required: [email, displayName, password]
      properties:
        email: { type: string, format: email }
        displayName: { type: string, minLength: 1 }
        password: { type: string, minLength: 8 }
        branchId: { type: string, format: uuid, nullable: true }
        roleIds: { type: array, items: { type: string, format: uuid } }
    UpdateUserRequest:
      type: object
      properties:
        displayName: { type: string, minLength: 1 }
        branchId: { type: string, format: uuid, nullable: true }
        isActive: { type: boolean }
        roleIds: { type: array, items: { type: string, format: uuid } }
    UserListResponse:
      type: object
      required: [items, total, page, pageSize]
      properties:
        items: { type: array, items: { $ref: "#/components/schemas/User" } }
        total: { type: integer }
        page: { type: integer }
        pageSize: { type: integer }

    Permission:
      type: object
      required: [id, module, action]
      properties:
        id: { type: string, format: uuid }
        module: { type: string }
        action: { type: string }

    Role:
      type: object
      required: [id, companyId, name, permissionIds, createdAt, updatedAt, voidedAt]
      properties:
        id: { type: string, format: uuid }
        companyId: { type: string, format: uuid }
        name: { type: string }
        permissionIds: { type: array, items: { type: string, format: uuid } }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
        voidedAt: { type: string, format: date-time, nullable: true }
    CreateRoleRequest:
      type: object
      required: [name]
      properties:
        name: { type: string, minLength: 1 }
        permissionIds: { type: array, items: { type: string, format: uuid } }
    UpdateRoleRequest:
      type: object
      properties:
        name: { type: string, minLength: 1 }
        permissionIds: { type: array, items: { type: string, format: uuid } }
    RoleListResponse:
      type: object
      required: [items, total, page, pageSize]
      properties:
        items: { type: array, items: { $ref: "#/components/schemas/Role" } }
        total: { type: integer }
        page: { type: integer }
        pageSize: { type: integer }

    Customer:
      type: object
      required:
        [id, companyId, branchId, name, customerType, phone, email, taxNumber, nationalId, address,
         creditLimitJod, creditPolicy, paymentTermsDays, notes, createdAt, updatedAt, voidedAt]
      properties:
        id: { type: string, format: uuid }
        companyId: { type: string, format: uuid }
        branchId: { type: string, format: uuid, nullable: true }
        name: { type: string }
        customerType: { type: string, enum: [individual, company] }
        phone: { type: string, nullable: true }
        email: { type: string, nullable: true }
        taxNumber: { type: string, nullable: true }
        nationalId: { type: string, nullable: true }
        address: { type: string, nullable: true }
        creditLimitJod: { type: string, description: "Decimal JOD, e.g. \"5000.000\"" }
        creditPolicy: { type: string, enum: [none, warning, block] }
        paymentTermsDays: { type: integer }
        notes: { type: string, nullable: true }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
        voidedAt: { type: string, format: date-time, nullable: true }
    CreateCustomerRequest:
      type: object
      required: [name]
      properties:
        name: { type: string, minLength: 1 }
        customerType: { type: string, enum: [individual, company] }
        branchId: { type: string, format: uuid, nullable: true }
        phone: { type: string, nullable: true }
        email: { type: string, nullable: true }
        taxNumber: { type: string, nullable: true }
        nationalId: { type: string, nullable: true }
        address: { type: string, nullable: true }
        creditLimitJod: { type: string }
        creditPolicy: { type: string, enum: [none, warning, block] }
        paymentTermsDays: { type: integer }
        notes: { type: string, nullable: true }
    UpdateCustomerRequest:
      type: object
      properties:
        name: { type: string, minLength: 1 }
        customerType: { type: string, enum: [individual, company] }
        branchId: { type: string, format: uuid, nullable: true }
        phone: { type: string, nullable: true }
        email: { type: string, nullable: true }
        taxNumber: { type: string, nullable: true }
        nationalId: { type: string, nullable: true }
        address: { type: string, nullable: true }
        creditLimitJod: { type: string }
        creditPolicy: { type: string, enum: [none, warning, block] }
        paymentTermsDays: { type: integer }
        notes: { type: string, nullable: true }
    CustomerListResponse:
      type: object
      required: [items, total, page, pageSize]
      properties:
        items: { type: array, items: { $ref: "#/components/schemas/Customer" } }
        total: { type: integer }
        page: { type: integer }
        pageSize: { type: integer }

    Project:
      type: object
      required: [id, companyId, branchId, customerId, name, address, createdAt, updatedAt, voidedAt]
      properties:
        id: { type: string, format: uuid }
        companyId: { type: string, format: uuid }
        branchId: { type: string, format: uuid, nullable: true }
        customerId: { type: string, format: uuid }
        name: { type: string }
        address: { type: string, nullable: true }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
        voidedAt: { type: string, format: date-time, nullable: true }
    CreateProjectRequest:
      type: object
      required: [customerId, name]
      properties:
        customerId: { type: string, format: uuid }
        name: { type: string, minLength: 1 }
        branchId: { type: string, format: uuid, nullable: true }
        address: { type: string, nullable: true }
    UpdateProjectRequest:
      type: object
      properties:
        name: { type: string, minLength: 1 }
        branchId: { type: string, format: uuid, nullable: true }
        address: { type: string, nullable: true }
    ProjectListResponse:
      type: object
      required: [items, total, page, pageSize]
      properties:
        items: { type: array, items: { $ref: "#/components/schemas/Project" } }
        total: { type: integer }
        page: { type: integer }
        pageSize: { type: integer }

    Product:
      type: object
      required:
        [id, companyId, branchId, name, code, characteristicStrengthMpa, unit, description,
         createdAt, updatedAt, voidedAt]
      properties:
        id: { type: string, format: uuid }
        companyId: { type: string, format: uuid }
        branchId: { type: string, format: uuid, nullable: true }
        name: { type: string }
