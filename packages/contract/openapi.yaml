      type: object
      required: [asOf, assets, liabilities, equity, totalAssetsJod, totalLiabilitiesJod, totalEquityJod]
      properties:
        asOf: { type: string, format: date-time }
        assets: { type: array, items: { $ref: "#/components/schemas/TrialBalanceRow" } }
        liabilities: { type: array, items: { $ref: "#/components/schemas/TrialBalanceRow" } }
        equity: { type: array, items: { $ref: "#/components/schemas/TrialBalanceRow" } }
        totalAssetsJod: { type: string }
        totalLiabilitiesJod: { type: string }
        totalEquityJod: { type: string, description: "Includes retained earnings from net income, so totalAssetsJod == totalLiabilitiesJod + totalEquityJod." }

    CashFlowLine:
      type: object
      required: [date, description, sourceDocumentType, amountJod, runningBalanceJod]
      properties:
        date: { type: string, format: date-time }
        description: { type: string }
        sourceDocumentType: { type: string }
        amountJod: { type: string, description: "Signed: positive for a debit (cash in), negative for a credit (cash out)." }
        runningBalanceJod: { type: string }
    CashFlowResponse:
      type: object
      required: [from, to, lines, netChangeJod]
      properties:
        from: { type: string, format: date-time }
        to: { type: string, format: date-time }
