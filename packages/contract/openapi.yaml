        rendered when `ageDays` equals the set's design age (28 days by
        default), since a product's characteristic strength is a design-age
        figure; earlier ages are recorded but return `pass: null`. A
        failing result at the design age raises a Notification and flags
        every batch record it came from (DOMAIN.md Invariant 6) — the flag
        will propagate onto deliveries drawn from that batch once Phase
        5's DeliveryOrder exists.
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CreateCubeTestSetRequest" }
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/QCCubeTestSet" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "400": { $ref: "#/components/responses/ValidationError" }

