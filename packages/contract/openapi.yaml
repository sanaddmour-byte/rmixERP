      - $ref: "#/components/parameters/IdParam"
    post:
      operationId: dispatchDeliveryOrder
      tags: [deliveryOrders]
      summary: >
        Assign a truck/driver and transition planned -> dispatched.
        Re-evaluates the customer's credit standing (DOMAIN.md/PLAN.md
        "credit check re-evaluated at dispatch", on top of Phase 2's
        confirm-time check) — a `block`-policy customer over their limit
        returns 409 unless a mandatory-reason override is supplied, which
        additionally requires the `deliveryOrders:approve` permission and
        is audited, mirroring Phase 2/3's override pattern.
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/DispatchDeliveryOrderRequest" }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DeliveryOrderDetail" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "400": { $ref: "#/components/responses/ValidationError" }
        "409":
          description: Blocked — customer's credit standing exceeds their limit
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }

