        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  parameters:
    IdParam:
      name: id
      in: path
      required: true
      schema: { type: string, format: uuid }
    PageParam:
      name: page
      in: query
      schema: { type: integer, minimum: 1 }
    PageSizeParam:
      name: pageSize
      in: query
      schema: { type: integer, minimum: 1, maximum: 100 }
    QParam:
      name: q
      in: query
      description: Free-text search.
      schema: { type: string }
    FormatParam:
      name: format
      in: query
      schema: { type: string, enum: [json, csv] }

  responses:
    Unauthorized:
      description: Not authenticated
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ErrorResponse" }
    Forbidden:
      description: Missing permission
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ErrorResponse" }
    NotFound:
      description: Not found
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ErrorResponse" }
    ValidationError:
      description: Validation error
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ErrorResponse" }

  schemas:
    HealthResponse:
      type: object
      required: [status, time]
      properties:
        status: { type: string, enum: [ok] }
        time: { type: string, format: date-time }

    LoginRequest:
      type: object
      required: [email, password]
      properties:
        email: { type: string, format: email }
        password: { type: string, minLength: 8 }

    RefreshRequest:
      type: object
      required: [refreshToken]
      properties:
        refreshToken: { type: string }

    AuthSession:
      type: object
      required: [accessToken, refreshToken, user]
      properties:
        accessToken: { type: string }
        refreshToken: { type: string }
        user: { $ref: "#/components/schemas/CurrentUser" }

    CurrentUser:
      type: object
      required: [id, companyId, branchId, email, displayName, permissions]
      properties:
        id: { type: string, format: uuid }
        companyId: { type: string, format: uuid }
        branchId: { type: string, format: uuid, nullable: true }
        email: { type: string, format: email }
        displayName: { type: string }
        permissions:
          type: array
          items: { type: string, description: "`${module}:${action}`, e.g. \"branches:view\"" }

    ErrorResponse:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [message, code]
          properties:
            message: { type: string }
            code: { type: string }
            details: { type: object }

    VoidRequest:
      type: object
      properties:
        reason: { type: string }

    Company:
      type: object
