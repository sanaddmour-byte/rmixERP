        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CustomerListResponse" }
            text/csv:
              schema: { type: string }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
    post:
      operationId: createCustomer
      tags: [customers]
