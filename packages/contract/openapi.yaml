  /permissions:
    get:
      operationId: listPermissions
      tags: [permissions]
      summary: The full system permission catalog (module x action). Read-only.
      security: [{ bearerAuth: [] }]
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
