  /delivery-orders/{id}/invoice:
    parameters:
      - $ref: "#/components/parameters/IdParam"
    post:
      operationId: generateInvoice
      tags: [invoices]
      summary: >
        Generate an invoice (or a cross-referencing combined+split pair)
        atomically from one delivered delivery order (DOMAIN.md's Billing
        section / CLAUDE.md's tax conventions). `combined` produces one
        invoice with a taxable concrete line and an exempt delivery line;
        `split` produces two invoices, each with one line, cross-referencing
        each other via `relatedInvoiceId`. DOMAIN.md Invariant 1 ("a
        delivery order can be invoiced once") is enforced by a DB unique
        constraint on (deliveryOrderId, taxTreatment), not application
        logic alone — a second attempt against the same delivery order
        returns 409 regardless of mode, and under concurrent identical
        requests exactly one succeeds. Accepts an `Idempotency-Key` header.
      security: [{ bearerAuth: [] }]
      parameters:
        - name: Idempotency-Key
          in: header
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/GenerateInvoiceRequest" }
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/GenerateInvoiceResult" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "400": { $ref: "#/components/responses/ValidationError" }
        "409":
          description: This delivery order has already been invoiced
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }

