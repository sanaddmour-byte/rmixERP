        - $ref: "#/components/parameters/PageSizeParam"
        - name: status
          in: query
          schema: { type: string, enum: [planned, dispatched, delivered, invoiced] }
        - name: branchId
          in: query
          schema: { type: string, format: uuid }
        - name: driverId
          in: query
          description: Filter to deliveries assigned to one driver — the mobile driver app's "my deliveries" list.
          schema: { type: string, format: uuid }
        - name: salesOrderId
          in: query
          description: Filter to deliveries drawn from one sales order — the sales-order detail screen's "see its deliveries" link.
          schema: { type: string, format: uuid }
        - name: scheduledFrom
          in: query
          description: Inclusive lower bound on scheduledAt (for the dispatch board's date range).
          schema: { type: string, format: date-time }
        - name: scheduledTo
          in: query
          description: Inclusive upper bound on scheduledAt.
          schema: { type: string, format: date-time }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DeliveryOrderListResponse" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
