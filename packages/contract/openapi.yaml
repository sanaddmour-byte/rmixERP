    post:
      operationId: deliverDeliveryOrder
      tags: [deliveryOrders]
      summary: >
        Record the proof of delivery and transition dispatched -> delivered
        in one transaction — DOMAIN.md Invariant 5 (cannot be delivered
        without a proof of delivery carrying a customer signature) is
        structural here: there is no other way to reach `delivered`.
