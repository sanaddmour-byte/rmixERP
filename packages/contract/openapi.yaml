          description: Which sales-order line this delivery fulfills — required before this delivery order can be invoiced (Phase 6).
        productionOrderId: { type: string, format: uuid, nullable: true }
        batchRecordId: { type: string, format: uuid, nullable: true }
        truckId: { type: string, format: uuid, nullable: true }
        driverId: { type: string, format: uuid, nullable: true }
        quantityM3: { type: string }
        status: { type: string, enum: [planned, dispatched, delivered, invoiced] }
        scheduledAt: { type: string, format: date-time }
        dispatchedAt: { type: string, format: date-time, nullable: true }
        deliveredAt: { type: string, format: date-time, nullable: true }
        qcFlagged:
          type: boolean
          description: Derived from batchRecordId's batch — true when that batch failed its design-age cube test.
        qcFlagReason: { type: string, nullable: true }
        creditCheckPolicy: { type: string, enum: [none, warning, block], nullable: true }
        creditCheckOutstandingJod: { type: string, nullable: true }
        creditCheckExceedsByJod: { type: string, nullable: true }
        creditOverride: { type: boolean }
        creditOverrideReason: { type: string, nullable: true }
        creditOverrideBy: { type: string, format: uuid, nullable: true }
        notes: { type: string, nullable: true }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
        voidedAt: { type: string, format: date-time, nullable: true }
    CreateDeliveryOrderRequest:
      type: object
      required: [branchId, salesOrderId, quantityM3, scheduledAt]
      properties:
        branchId: { type: string, format: uuid }
        salesOrderId: { type: string, format: uuid }
        salesOrderLineId: { type: string, format: uuid, nullable: true }
        productionOrderId: { type: string, format: uuid, nullable: true }
        batchRecordId: { type: string, format: uuid, nullable: true }
        quantityM3: { type: string }
        scheduledAt: { type: string, format: date-time }
        notes: { type: string, nullable: true }
    UpdateDeliveryOrderRequest:
      type: object
      properties:
        quantityM3: { type: string }
        scheduledAt: { type: string, format: date-time }
        notes: { type: string, nullable: true }
    DispatchDeliveryOrderRequest:
      type: object
      required: [truckId, driverId]
      properties:
        truckId: { type: string, format: uuid }
        driverId: { type: string, format: uuid }
        override:
          type: object
          nullable: true
          required: [reason]
          properties:
            reason: { type: string, minLength: 1 }
    DeliverDeliveryOrderRequest:
      type: object
      required: [receivedQuantityM3, signedByName, signatureData]
      properties:
        receivedQuantityM3: { type: string }
        signedByName: { type: string, minLength: 1 }
        signatureData: { type: string, description: "Base64 data URI captured from the driver app's signature pad." }
        notes: { type: string, nullable: true }
    DeliveryOrderListResponse:
      type: object
      required: [items, total, page, pageSize]
      properties:
        items: { type: array, items: { $ref: "#/components/schemas/DeliveryOrder" } }
        total: { type: integer }
        page: { type: integer }
        pageSize: { type: integer }

    ProofOfDelivery:
      type: object
      required: [id, companyId, deliveryOrderId, receivedQuantityM3, signedByName, signatureData, notes, createdAt]
      properties:
        id: { type: string, format: uuid }
        companyId: { type: string, format: uuid }
        deliveryOrderId: { type: string, format: uuid }
        receivedQuantityM3: { type: string }
        signedByName: { type: string }
        signatureData: { type: string }
        notes: { type: string, nullable: true }
        createdAt: { type: string, format: date-time }
    DeliveryOrderDetail:
      allOf:
        - $ref: "#/components/schemas/DeliveryOrder"
        - type: object
          required: [proofOfDelivery]
          properties:
            proofOfDelivery:
              allOf:
                - $ref: "#/components/schemas/ProofOfDelivery"
              nullable: true

    DispatchScheduleItem:
      type: object
      required:
        [id, status, quantityM3, scheduledAt, dispatchedAt, deliveredAt, truckId, driverId, customerName, qcFlagged]
      properties:
        id: { type: string, format: uuid }
        status: { type: string, enum: [planned, dispatched, delivered, invoiced] }
        quantityM3: { type: string }
        scheduledAt: { type: string, format: date-time }
        dispatchedAt: { type: string, format: date-time, nullable: true }
        deliveredAt: { type: string, format: date-time, nullable: true }
        truckId: { type: string, format: uuid, nullable: true }
        driverId: { type: string, format: uuid, nullable: true }
        customerName: { type: string }
        qcFlagged: { type: boolean }
    DispatchScheduleResponse:
      type: object
      required: [items]
      properties:
        items: { type: array, items: { $ref: "#/components/schemas/DispatchScheduleItem" } }

    ClearanceFields:
      type: object
      required:
        [clearanceStatus, clearanceIcv, clearanceQrPayload, clearanceProviderReference, clearanceAttempts,
         clearanceNextRetryAt, clearanceError]
      properties:
        clearanceStatus: { type: string, enum: [pending, cleared, rejected, retrying] }
        clearanceIcv: { type: integer, nullable: true, description: "Per-income-source-sequence monotonic Invoice Counter Value allocated at submission." }
        clearanceQrPayload: { type: string, nullable: true }
        clearanceProviderReference: { type: string, nullable: true }
        clearanceAttempts: { type: integer }
        clearanceNextRetryAt: { type: string, format: date-time, nullable: true }
        clearanceError: { type: string, nullable: true }

    Invoice:
      allOf:
        - $ref: "#/components/schemas/ClearanceFields"
        - type: object
          required:
            [id, companyId, branchId, customerId, invoiceNumber, status, invoicedAt, relatedInvoiceId, subtotalJod,
             taxJod, totalJod, notes, createdAt, updatedAt, voidedAt]
          properties:
            id: { type: string, format: uuid }
            companyId: { type: string, format: uuid }
            branchId: { type: string, format: uuid }
            customerId: { type: string, format: uuid }
            invoiceNumber: { type: string, description: "Gapless {BRANCH}-{YYMM}-{SEQ}, allocated in the same transaction as the invoice." }
            status: { type: string, enum: [draft, pending_clearance, cleared, issued, partially_paid, paid, rejected] }
            invoicedAt: { type: string, format: date-time }
            relatedInvoiceId:
              type: string
              format: uuid
              nullable: true
              description: The other invoice in a combined+split pair — null for a combined invoice.
            subtotalJod: { type: string }
            taxJod: { type: string }
            totalJod: { type: string }
            notes: { type: string, nullable: true }
            createdAt: { type: string, format: date-time }
            updatedAt: { type: string, format: date-time }
            voidedAt: { type: string, format: date-time, nullable: true }

    InvoiceLine:
      type: object
      required:
        [id, companyId, invoiceId, deliveryOrderId, taxTreatment, description, quantityM3, unitPriceJod, netJod,
         taxRateBasisPoints, taxJod, totalJod, createdAt]
      properties:
        id: { type: string, format: uuid }
        companyId: { type: string, format: uuid }
        invoiceId: { type: string, format: uuid }
        deliveryOrderId: { type: string, format: uuid, nullable: true }
        taxTreatment: { type: string, enum: [taxable, exempt] }
        description: { type: string }
        quantityM3: { type: string, nullable: true }
        unitPriceJod: { type: string, nullable: true }
        netJod: { type: string }
        taxRateBasisPoints: { type: integer }
        taxJod: { type: string }
        totalJod: { type: string }
        createdAt: { type: string, format: date-time }

    CreditNote:
      allOf:
        - $ref: "#/components/schemas/ClearanceFields"
        - type: object
          required:
            [id, companyId, branchId, invoiceId, noteNumber, amountJod, taxJod, totalJod, reason, createdAt,
             updatedAt, voidedAt]
          properties:
            id: { type: string, format: uuid }
            companyId: { type: string, format: uuid }
            branchId: { type: string, format: uuid }
            invoiceId: { type: string, format: uuid }
            noteNumber: { type: string }
            amountJod: { type: string }
            taxJod: { type: string }
            totalJod: { type: string }
            reason: { type: string }
            createdAt: { type: string, format: date-time }
            updatedAt: { type: string, format: date-time }
            voidedAt: { type: string, format: date-time, nullable: true }
    CreateCreditNoteRequest:
      type: object
      required: [amountJod, reason]
      properties:
        amountJod: { type: string }
        taxJod: { type: string }
        reason: { type: string, minLength: 1 }

    DebitNote:
      allOf:
        - $ref: "#/components/schemas/ClearanceFields"
        - type: object
          required:
            [id, companyId, branchId, invoiceId, noteNumber, amountJod, taxJod, totalJod, reason, createdAt,
             updatedAt, voidedAt]
          properties:
            id: { type: string, format: uuid }
            companyId: { type: string, format: uuid }
            branchId: { type: string, format: uuid }
            invoiceId: { type: string, format: uuid }
            noteNumber: { type: string }
            amountJod: { type: string }
            taxJod: { type: string }
            totalJod: { type: string }
            reason: { type: string }
            createdAt: { type: string, format: date-time }
            updatedAt: { type: string, format: date-time }
            voidedAt: { type: string, format: date-time, nullable: true }
    CreateDebitNoteRequest:
      type: object
      required: [amountJod, reason]
      properties:
        amountJod: { type: string }
        taxJod: { type: string }
        reason: { type: string, minLength: 1 }

    InvoiceDetail:
      allOf:
        - $ref: "#/components/schemas/Invoice"
        - type: object
          required: [lines, creditNotes, debitNotes]
          properties:
            lines: { type: array, items: { $ref: "#/components/schemas/InvoiceLine" } }
            creditNotes: { type: array, items: { $ref: "#/components/schemas/CreditNote" } }
            debitNotes: { type: array, items: { $ref: "#/components/schemas/DebitNote" } }
    InvoiceListResponse:
      type: object
      required: [items, total, page, pageSize]
      properties:
        items: { type: array, items: { $ref: "#/components/schemas/Invoice" } }
        total: { type: integer }
        page: { type: integer }
        pageSize: { type: integer }

    GenerateInvoiceRequest:
      type: object
      required: [mode]
      properties:
        mode: { type: string, enum: [combined, split] }
    GenerateInvoiceResult:
      type: object
      required: [invoices]
      properties:
        invoices: { type: array, items: { $ref: "#/components/schemas/InvoiceDetail" } }

    ClearanceQueueItem:
      allOf:
        - $ref: "#/components/schemas/ClearanceFields"
        - type: object
          required: [id, documentType, documentNumber, branchId, totalJod, createdAt]
          properties:
            id: { type: string, format: uuid }
            documentType: { type: string, enum: [invoice, credit_note, debit_note] }
            documentNumber: { type: string }
            branchId: { type: string, format: uuid }
            totalJod: { type: string }
            createdAt: { type: string, format: date-time }
    ClearanceQueueResponse:
      type: object
      required: [items, total, page, pageSize]
      properties:
        items: { type: array, items: { $ref: "#/components/schemas/ClearanceQueueItem" } }
        total: { type: integer }
        page: { type: integer }
        pageSize: { type: integer }
