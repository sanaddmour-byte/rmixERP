        branchId: { type: string, format: uuid, nullable: true }
        email: { type: string, format: email }
        displayName: { type: string }
        permissions:
          type: array
          items: { type: string, description: "`${module}:${action}`, e.g. \"branches:view\"" }

    ErrorResponse:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [message, code]
          properties:
            message: { type: string }
            code: { type: string }
            details: { type: object }

    VoidRequest:
      type: object
      properties:
