    TrialBalanceRow:
      type: object
      required: [accountId, accountCode, accountName, accountType, balanceJod]
      properties:
        accountId: { type: string, format: uuid }
        accountCode: { type: string }
        accountName: { type: string }
        accountType: { type: string, enum: [asset, liability, equity, revenue, expense] }
        balanceJod: { type: string, description: "Signed positive on the account's normal side." }
    TrialBalanceResponse:
      type: object
      required: [asOf, rows, totalDebitJod, totalCreditJod]
      properties:
        asOf: { type: string, format: date-time }
        rows: { type: array, items: { $ref: "#/components/schemas/TrialBalanceRow" } }
        totalDebitJod: { type: string }
        totalCreditJod: { type: string, description: "Always equal to totalDebitJod — the test that fails if they diverge." }

    ProfitAndLossRow:
      type: object
      required: [accountId, accountCode, accountName, amountJod]
      properties:
        accountId: { type: string, format: uuid }
        accountCode: { type: string }
        accountName: { type: string }
        amountJod: { type: string }
    ProfitAndLossResponse:
      type: object
      required: [from, to, revenue, expenses, totalRevenueJod, totalExpensesJod, netIncomeJod]
      properties:
        from: { type: string, format: date-time }
        to: { type: string, format: date-time }
        revenue: { type: array, items: { $ref: "#/components/schemas/ProfitAndLossRow" } }
        expenses: { type: array, items: { $ref: "#/components/schemas/ProfitAndLossRow" } }
        totalRevenueJod: { type: string }
        totalExpensesJod: { type: string }
        netIncomeJod: { type: string }

