      tags: [deliveryOrders]
      summary: >
        Assign a truck/driver and transition planned -> dispatched.
        Re-evaluates the customer's credit standing (DOMAIN.md/PLAN.md
        "credit check re-evaluated at dispatch", on top of Phase 2's
        confirm-time check) — a `block`-policy customer over their limit
        returns 409 unless a mandatory-reason override is supplied, which
        additionally requires the `deliveryOrders:approve` permission and
        is audited, mirroring Phase 2/3's override pattern.
