openapi: 3.1.0
info:
  title: RMC ERP API
  version: 0.2.0
  description: >
    Contract-first source of truth. The TS client, React Query hooks, and
    Zod request/response schemas consumed by apps/web and apps/mobile are
    generated from this file — see CLAUDE.md. Do not hand-write a fetch
    call that bypasses the generated hooks.

    Money fields are JOD decimal strings (e.g. "1234.567"), never numbers
    — formatting/parsing to the internal integer-fils representation
    happens at this HTTP boundary (packages/core's jodStringToFils /
    filsToJodString), matching CLAUDE.md's money conventions.
servers:
  - url: /api
tags:
  - name: system
  - name: auth
  - name: company
  - name: branches
  - name: users
  - name: roles
  - name: permissions
  - name: customers
  - name: projects
  - name: products
  - name: priceLists
  - name: chargeTypes
  - name: rawMaterials
  - name: vendors
  - name: quotations
  - name: salesOrders
  - name: mixDesigns
  - name: inventory
  - name: productionOrders
  - name: qc
  - name: notifications
  - name: trucks
  - name: drivers
  - name: deliveryOrders
  - name: invoices
  - name: clearance
  - name: receivables
  - name: procurement
  - name: gl
  - name: fleetOps
  - name: approvals
  - name: devicePushTokens

paths:
  /health:
    get:
      operationId: getHealth
      tags: [system]
      summary: Liveness/readiness probe.
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthResponse"

  /auth/login:
    post:
      operationId: login
      tags: [auth]
      summary: Exchange email + password for an access/refresh token pair.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginRequest"
      responses:
        "200":
          description: Authenticated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthSession"
        "401":
          description: Invalid credentials
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /auth/refresh:
    post:
      operationId: refreshSession
      tags: [auth]
      summary: Exchange a valid refresh token for a new access/refresh token pair (rotates the refresh token).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RefreshRequest"
      responses:
        "200":
          description: Refreshed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthSession"
        "401":
          description: Refresh token invalid, expired, or revoked
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /auth/logout:
    post:
      operationId: logout
      tags: [auth]
      summary: Revoke a refresh token.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RefreshRequest"
      responses:
        "204":
          description: Logged out

  /auth/me:
    get:
      operationId: getCurrentUser
      tags: [auth]
      summary: The authenticated user and their permissions.
      security:
        - bearerAuth: []
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CurrentUser"
        "401":
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /company:
    get:
      operationId: getCompany
      tags: [company]
      summary: The single tenant company row.
      security: [{ bearerAuth: [] }]
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Company" }
        "401": { $ref: "#/components/responses/Unauthorized" }
    put:
      operationId: updateCompany
      tags: [company]
      summary: Update company settings.
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/UpdateCompanyRequest" }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Company" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "400": { $ref: "#/components/responses/ValidationError" }

  /branches:
    get:
      operationId: listBranches
      tags: [branches]
      summary: List branches.
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: "#/components/parameters/PageParam"
        - $ref: "#/components/parameters/PageSizeParam"
        - $ref: "#/components/parameters/QParam"
        - $ref: "#/components/parameters/FormatParam"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/BranchListResponse" }
            text/csv:
              schema: { type: string }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
    post:
      operationId: createBranch
      tags: [branches]
      summary: Create a branch.
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CreateBranchRequest" }
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Branch" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "400": { $ref: "#/components/responses/ValidationError" }

  /branches/{id}:
    parameters:
      - $ref: "#/components/parameters/IdParam"
    get:
      operationId: getBranch
      tags: [branches]
      summary: Get a branch by id.
      security: [{ bearerAuth: [] }]
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Branch" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
    put:
      operationId: updateBranch
      tags: [branches]
      summary: Update a branch.
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/UpdateBranchRequest" }
      responses:
        "200":
          description: OK
          content:
            application/json:
