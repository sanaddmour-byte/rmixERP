        "400": { $ref: "#/components/responses/ValidationError" }
    delete:
      operationId: voidRole
      tags: [roles]
      summary: Soft-delete (void) a role.
      security: [{ bearerAuth: [] }]
      requestBody:
        content:
          application/json:
            schema: { $ref: "#/components/schemas/VoidRequest" }
      responses:
        "204": { description: Voided }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /permissions:
    get:
      operationId: listPermissions
      tags: [permissions]
      summary: The full system permission catalog (module x action). Read-only.
      security: [{ bearerAuth: [] }]
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Permission" }
